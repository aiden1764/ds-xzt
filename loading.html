<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
    <title>ds-xzt · 环境依赖配置</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1f2328;
        --muted: #697386;
        --line: #d5d9e0;
        --ok: #1a7f5a;
        --bad: #d92d20;
        --wait: #8a6d1f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
        background: #f7f7f8;
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { width: min(760px, 100%); }
      header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
      .mark {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: #202b3f;
        color: #fff;
        font: 700 18px/1 "Segoe UI", system-ui, sans-serif;
      }
      h1 { margin: 0; font-size: 20px; line-height: 1.25; }
      #stage { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
      .panel { border: 1px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden; }
      .dep {
        display: grid;
        grid-template-columns: 150px 1fr 62px;
        align-items: center;
        gap: 12px;
        padding: 11px 14px;
        border-top: 1px solid #eef0f4;
      }
      .dep:first-child { border-top: 0; }
      .dep .name { font-size: 13px; font-weight: 600; }
      .dep .path {
        font: 12px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .badge {
        justify-self: end;
        padding: 3px 9px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        background: #eef0f4;
        color: var(--wait);
      }
      .badge.ok { background: #e6f4ee; color: var(--ok); }
      .badge.bad { background: #fdecea; color: var(--bad); }
      .logbox { margin-top: 16px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
      .loghead {
        padding: 9px 14px;
        border-bottom: 1px solid #eef0f4;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
      }
      #log {
        margin: 0;
        padding: 12px 14px;
        height: 190px;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: 12px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
        color: #333c4d;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="mark" aria-hidden="true">DSH</div>
        <div>
          <h1>ds-xzt</h1>
          <p id="stage">运行环境依赖配置 · 正在检测…</p>
        </div>
      </header>

      <section class="panel">
        <div class="dep" id="row-node">
          <span class="name">Node 运行时</span>
          <code class="path">检测中…</code>
          <span class="badge">检测中</span>
        </div>
        <div class="dep" id="row-runtime">
          <span class="name">DSH 运行时</span>
          <code class="path">检测中…</code>
          <span class="badge">检测中</span>
        </div>
        <div class="dep" id="row-entry">
          <span class="name">DSH 入口</span>
          <code class="path">检测中…</code>
          <span class="badge">检测中</span>
        </div>
        <div class="dep" id="row-server">
          <span class="name">本地服务</span>
          <code class="path">等待启动…</code>
          <span class="badge">检测中</span>
        </div>
        <div class="dep" id="row-workspace">
          <span class="name">工作区 / 会话</span>
          <code class="path">等待初始化…</code>
          <span class="badge">检测中</span>
        </div>
      </section>

      <section class="logbox">
        <div class="loghead">启动日志</div>
        <pre id="log"></pre>
      </section>
    </main>
    <script src="./loading.js" defer></script>
  </body>
</html>
