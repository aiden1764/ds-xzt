<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
    <title>ds-xzt</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        background: #f7f7f8;
        color: #1f2328;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      }
      main {
        width: min(560px, 100%);
        text-align: center;
      }
      h1 { margin: 0 0 16px; font-size: 24px; line-height: 1.25; }
      pre {
        overflow-wrap: anywhere;
        white-space: pre-wrap;
        padding: 18px;
        border: 1px solid #d5d9e0;
        border-radius: 8px;
        background: #fff;
        text-align: left;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
      }
      button {
        margin: 20px 6px 0;
        padding: 9px 16px;
        border: 0;
        border-radius: 6px;
        background: #4d6bfe;
        color: #fff;
        font: 600 14px/1 system-ui, Segoe UI, sans-serif;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ds-xzt 无法启动</h1>
      <pre id="message"></pre>
      <button id="reload" type="button">重试</button>
      <button id="quit" type="button">关闭</button>
    </main>
    <script src="./error.js" defer></script>
  </body>
</html>
